name: Import self-contained Canva Code Hisui 300 app
on:
  push:
    branches: ['claude/escape-room-ppt-improve-c8enus']
    paths: ['.github/workflows/import-hisui-canva-300.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'choivoo/-'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit 300-scene Canva Code app
        env:
          PACKAGE_URL: 'https://d2ol7oe51mr4n9.cloudfront.net/user_33oAHDlK5abT27mI3gl8nFx8kg3/01abcc7a-cd74-422c-8a2c-efe1bf9b4133.zip'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --output /tmp/canva-hisui-300.zip "$PACKAGE_URL"
          printf '%s  %s\n' 'bd1354169d122cd44c73bbd163017cad39e82f4ea15fedbbf5ea01da06818814' '/tmp/canva-hisui-300.zip' | sha256sum --check
          mkdir -p canva-code
          unzip -oq /tmp/canva-hisui-300.zip -d canva-code
          python3 - <<'PY'
          import json, pathlib, zipfile
          root=pathlib.Path('canva-code')
          data=json.loads((root/'hisui300_data.json').read_text(encoding='utf-8'))
          assert len(data)==300
          assert sum(s['kind']=='quiz' for s in data)==60
          assert sum(s['kind']=='battle' for s in data)==8
          page=(root/'Canva_Code_Hisui_300_Interactive.html').read_text(encoding='utf-8')
          assert 'var MAX = SLIDES.length;' in page
          assert '__STORIES_DATA__' not in page
          print('Verified 300 scenes, 60 quizzes, 8 battles')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canva-code
          if git diff --cached --quiet; then
            echo 'Canva Code files already current'
          else
            git commit -m 'Add self-contained 300-scene Canva Code interactive experience'
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi
