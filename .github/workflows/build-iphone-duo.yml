name: Build iPhone Duo 1.0 APK
on:
  push:
    branches: [ "iphone-duo-1.0-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed personal release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk iPhone-Duo-1.0-release.apk
          sha256sum iPhone-Duo-1.0-release.apk > iPhone-Duo-1.0-release.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-Duo-1.0-APK
          path: |
            iPhone-Duo-1.0-release.apk
            iPhone-Duo-1.0-release.sha256
          if-no-files-found: error
          retention-days: 7
