name: Import verified Hisui 200-slide PowerPoint

on:
  push:
    branches:
      - 'claude/escape-room-ppt-improve-c8enus'
    paths:
      - '.github/workflows/import-hisui-200.yml'

permissions:
  contents: write

jobs:
  import-presentation:
    if: github.repository == 'choivoo/-'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
      - name: Download, verify, and commit presentation
        env:
          ARTIFACT_URL: 'https://d2ol7oe51mr4n9.cloudfront.net/user_33oAHDlK5abT27mI3gl8nFx8kg3/5d44577f-4796-4260-a394-0b2ac59e8e8d.pptx'
        run: |
          set -euo pipefail
          target="레전드_아르세우스_히스이_대모험_스토리확장_200장.pptx"
          curl --fail --location --retry 3 --silent --show-error --output "$target" "$ARTIFACT_URL"
          printf '%s  %s\n' 'a5a4e0a66feb0acb0a002a57c007b4a64c42bd32172402ac5627407595ee716a' "$target" | sha256sum --check
          python3 -c 'import zipfile,sys,re; p=sys.argv[1]; z=zipfile.ZipFile(p); n=sum(bool(re.fullmatch(r"ppt/slides/slide[0-9]+\.xml", f)) for f in z.namelist()); assert n==200, f"Expected 200 slides, got {n}"; assert z.testzip() is None, "Corrupt PPTX"; print(f"Verified {n} slides")' "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          if git diff --cached --quiet; then
            echo 'Presentation is already current'
            exit 0
          fi
          git commit -m 'Add verified 200-slide Hisui Legends Arceus PowerPoint'
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
